[project]
name = "decider"
version = "0.1.0"
description = "decider-v2 M0 — bev-decider-style typed decision baseline (Qwen3-0.6B, first 20 layers, order-invariant option mask, 2-layer self-attention decision head)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "torch>=2.9,<3",
    "transformers>=4.51",
    "peft>=0.15",
    "safetensors>=0.5",
    "datasets>=3.2",
    "accelerate>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Only used by eval/compare_bev.py to run the original bev-decider-0.4B side by side.
bev = ["bev-decider>=0.2.1"]

[tool.uv.sources]
# PyPI Windows wheels are CPU-only; pull CUDA 13.0 builds for the local RTX 4050
# (driver CUDA 13.4). CPU-only machines can delete this source block — see NOTES.md.
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (full smoke training run, real-backbone equivalence)",
]

[tool.ruff]
line-length = 100
