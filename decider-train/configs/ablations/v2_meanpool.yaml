# Tier-2 ablation: mean-pool the option instead of the last content token.
#
# One change vs configs/baseline_replica.yaml — pool: mean. The reference (bev-decider) reads the
# option embedding at the last content token of the option's own text (ARCH_REVIEW.md §1.4);
# `opt_end` pooling is only reachable in --mode special, so mean is the honest version of
# arch.md's mean-pooling ablation.
seed: 0

model:
  backbone_name: Qwen/Qwen3-0.6B
  num_layers: 20
  random_init: 0
  attn_implementation: sdpa

lora:
  r: 8
  alpha: 16
  dropout: 0.0
  last_k_layers: 12
  include_mlp: 0

head:
  type: v1
  new_dim: 512
  layers: 2
  heads: 8
  dropout: 0.0

loss:
  label_smoothing: 0.0
  emd_lambda: 0.0

data:
  max_state_tokens: 1024
  max_choice_tokens: 64
  mode: bev
  pool: mean
  shuffle_options: 0
  num_workers: 8

optim:
  batch_size: 32
  grad_accum_steps: 2
  max_steps: 14688
  epochs: 2
  lr_lora: 1.0e-04
  lr_head: 1.0e-03
  warmup_ratio: 0.05
  weight_decay: 0.01
  grad_clip: 1.0

logging:
  log_every: 20
  eval_every: 3672
  save_every: 3672
