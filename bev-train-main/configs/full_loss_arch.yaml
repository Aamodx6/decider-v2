# RUNG C — RUNG B + arch.md's stage-1 losses (arch.md:243-245, :256). Loss only.
#
#   CE, label smoothing 0.05   -> loss.label_smoothing: 0.05
#   score: CE + 0.5 * EMD      -> loss.emd_weight: 0.5
#   weighted mean over types   -> loss.balance_types: true
#
# LAST in the ladder on purpose. Bundled in the small ladder these measured -2.0 pts accuracy
# and worse ECE (0.068 vs 0.054), so this rung may well confirm that at full scale. Running it
# last means Rungs A and B are already banked either way.
#
# balance_types averages within each task type before averaging across types, so it changes the
# effective per-type weighting; note choice is 44.8% of questions, noul 41.7%, score 13.5%.
seed: 0

model:
  name: Qwen/Qwen3-0.6B
  num_layers: 20

data:
  configs: [all]
  max_train_questions: null
  max_test_questions: 0
  max_dev_questions: 5000
  max_state_tokens: 1024
  max_choice_tokens: 64
  batch_size: 32
  num_workers: 12

lora:
  target: attn_mlp
  last_k_layers: 20
  r: 16
  alpha: 32
  dropout: 0.0

head:
  new_dim: 512
  num_layers: 2
  ctx_queries: 0

loss:
  label_smoothing: 0.05        # was 0.0 (arch.md stage 1)
  emd_weight: 0.5             # was 0.0, applied to score rows only
  use_soft_labels: false
  balance_types: true         # was false

optim:
  epochs: 1
  lr_lora: 2.0e-4
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.03
  grad_clip: 1.0
  grad_accum_steps: 4
  resume_save_seconds: 300

logging:
  log_every: 20
  eval_every: 1000
  save_every: 500