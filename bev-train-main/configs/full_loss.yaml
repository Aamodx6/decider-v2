# Ablation "loss": baseline + label smoothing 0.05 on all types, lambda=0.5 CDF-EMD on score,
# per-task-type loss averaging. Soft labels stay off (separate ablation: full_softlabels.yaml).
seed: 0

model:
  name: Qwen/Qwen3-0.6B
  num_layers: 20

data:
  configs: [all]
  max_train_questions: null
  max_test_questions: 0
  max_dev_questions: 5000
  max_state_tokens: 1024
  max_choice_tokens: 64
  batch_size: 32
  num_workers: 6

lora:
  target: attn
  last_k_layers: 12
  r: 8
  alpha: 16
  dropout: 0.0

head:
  new_dim: 512
  num_layers: 2
  ctx_queries: 0

loss:
  label_smoothing: 0.05
  emd_weight: 0.5
  use_soft_labels: false
  balance_types: true

optim:
  epochs: 1
  lr_lora: 1.0e-4
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  grad_accum_steps: 2

logging:
  log_every: 20
  eval_every: 1000
  save_every: 500
